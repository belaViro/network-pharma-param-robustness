[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-pharmacology-sensitivity"
version = "1.0.0"
description = "Parameter robustness sensitivity analysis for network pharmacology"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "networkx>=3.0,<4.0",
    "scipy>=1.10,<2.0",
    "requests>=2.28,<3.0",
    "matplotlib>=3.6,<4.0",
    "seaborn>=0.12,<1.0",
    "gseapy>=1.0,<2.0",
    "goatools>=1.3,<2.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
acquisition = [
    "playwright>=1.40,<2.0",
    "playwright-stealth>=2.0,<3.0",
    "selenium>=4.0,<5.0",
]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["src*"]
